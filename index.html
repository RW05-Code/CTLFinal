<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://kit.fontawesome.com/f6a3e4d5fc.js" crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Login</title>
</head>
<body id="loginb">
    <header>
        <a href="https://github.com/RW05-Code/CTLFinal" target="_blank" aria-label="View project repo">
            <i class="fa-brands fa-github fa-2x"></i>
        </a>
        <a class="header-badge" href="" aria-label="Return to portfolio selection">
            <span class="header-badge__page">Login</span>
        </a>
    </header>
    <div class="login-container">
        <div class="login-box">
            <h4 class="login-title">Welcome back</h4>
            <div class="form-row">
                <label for="first">First Name:</label>
                <input id="first" type="text" placeholder="John" required>
            </div>
            <div class="form-row">
                <label for="last">Last Name:</label>
                <input id="last" type="text" placeholder="Doe" required>
            </div>
            <div class="button-row">
                <a id="sub" class="submit-link" href="Pages/prehome.html">SUBMIT</a>
            </div>
            <p class="note">* There is no PHP involved</p>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
