<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://kit.fontawesome.com/f6a3e4d5fc.js" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selection</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header>
        <a href="https://github.com/RW05-Code/CTLFinal" target="_blank" aria-label="View project repo">
            <i class="fa-brands fa-github fa-2x"></i>
        </a>
        <a class="header-badge" href="prehome.html" aria-label="Return to portfolio selection">
            <span class="header-badge__page">Selection</span>
        </a>
    </header>
    <main class="home-page">
        <div class="bub">
            <img src="" style="display:block; margin:5px;">
            <h2 class="h2bub" id="hello">Welcome, friend</h2>
            <p class="section-intro">Pick a portfolio to explore.</p>
        </div>
        <div class="selection-box">
            <h3 id="prehome-h3">Select a Portfolio</h3>
            <div class="selection-content">
                <a class="port-selection" href="home.html">
                    <span class="port-badge">
                        <img src="../ImagesAndVideos/Image.png" alt="Profile" class="port-badgeimg">
                        <span>RW05-Code</span>
                    </span>
                </a>
                <a class="port-selection" href="Potato/HomePotato.html">
                    <span class="port-badge">
                        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ5f2lEJe9n0m_kkonNtblpVGveEdLoYAN2cZxYvPDCLENcGGU6LOgNWJs&s=10" alt="Profile" class="port-badgeimg">
                        <span>Potato</span>
                    </span>
                </a>
            </div>
        </div>
    </main>
    <script src="../index.js"></script>
</body>
</html>
